<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robert Betlejewski · talk about AI</title>
<meta name="description" content="Ask about bringing AI into your company. Robert Betlejewski's voice agent answers.">
<link rel="icon" href="/benchly-logo.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #fbfaf8; --ink: #141a24; --mute: #6b7180;
    --brand: #2e3c7d; --blush: #efdfe9; --hair: #e7e3ea;
    color-scheme: light;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; }
  html, body { min-height: 100%; }
  body {
    background: radial-gradient(120% 80% at 50% 0%, #f6eef3 0%, var(--paper) 60%);
    color: var(--ink); -webkit-font-smoothing: antialiased;
    font: 400 16px/1.5 Poppins, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    min-height: 100svh; display: flex; flex-direction: column; align-items: center;
    padding: calc(24px + env(safe-area-inset-top, 0px)) 16px calc(16px + env(safe-area-inset-bottom, 0px));
  }
  :focus-visible { outline: 2px solid var(--brand); outline-offset: 4px; border-radius: 8px; }

  .top { line-height: 0; }
  .top img { height: 26px; width: auto; mix-blend-mode: multiply; }

  main {
    flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center;
    width: min(100%, 340px); --pw: min(100%, 320px, calc((100svh - 380px) * .75)); min-width: 220px; padding: 28px 0;
  }

  .portrait {
    position: relative; width: var(--pw); aspect-ratio: 3 / 4; border-radius: 28px; overflow: hidden;
    background: linear-gradient(165deg, #f3e8ef, #e3e2f1);
    box-shadow: 0 30px 60px -28px rgba(26,33,60,.4);
  }
  .portrait img {
    width: 100%; height: 100%; object-fit: cover; object-position: 50% 30%; display: block;
    filter: grayscale(1); transform: scale(1.03);
    transition: filter 1s ease, transform 1.4s cubic-bezier(.2,.7,.2,1);
  }
  .portrait.live img { filter: none; transform: scale(1); }
  .portrait .initials {
    position: absolute; inset: 0; display: none; place-items: center;
    font-size: clamp(64px, 10vw, 96px); font-weight: 500; letter-spacing: -.05em; color: var(--brand);
  }
  .portrait.noimg img { display: none; }
  .portrait.noimg .initials { display: grid; }

  .wave { position: absolute; left: 0; right: 0; bottom: 44px; width: 100%; height: 48px; display: block; }
  .portrait::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(to top, rgba(20,26,48,.45), transparent 40%); opacity: 0; transition: opacity .6s ease; }
  .portrait.live::after { opacity: 1; }

  .call {
    position: relative; z-index: 1; margin-top: -36px; width: 72px; height: 72px; border-radius: 50%; cursor: pointer;
    display: grid; place-items: center; background: var(--brand); color: #fff; border: 4px solid var(--paper);
    box-shadow: 0 12px 28px -10px rgba(46,60,125,.7);
    transition: background-color .25s ease, color .25s ease, transform .15s ease;
  }
  .call::before { content: ""; position: absolute; inset: -4px; border-radius: 50%; border: 2px solid var(--brand);
    animation: halo 2.6s ease-out infinite; pointer-events: none; }
  @keyframes halo { from { transform: scale(1); opacity: .5; } to { transform: scale(1.45); opacity: 0; } }
  .call:hover { transform: scale(1.05); }
  .call:active { transform: scale(.95); }
  .call svg { width: 28px; height: 28px; }
  .call .i-stop, .call.live .i-mic { display: none; }
  .call.live .i-stop { display: block; }
  .call.live { background: #fff; color: #c62f2f; }
  .call.live::before { border-color: #c62f2f; }
  .call[aria-busy="true"] { opacity: .7; cursor: progress; }
  .call[aria-busy="true"]::before { animation-duration: 1s; }

  .name { margin-top: 18px; font-size: 18px; font-weight: 500; letter-spacing: -.01em; }
  .sub { margin-top: 6px; max-width: 30ch; text-align: center; text-wrap: balance; font-size: 14.5px; color: var(--mute); }
  .steps { margin-top: 14px; padding: 0; list-style: none; display: flex; gap: 6px 14px; flex-wrap: wrap; justify-content: center;
    counter-reset: s; font-size: 12.5px; color: var(--mute); }
  .steps li { counter-increment: s; display: inline-flex; align-items: center; gap: 6px; }
  .steps li::before { content: counter(s); width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
    font-size: 11px; font-weight: 500; color: var(--brand); background: rgba(46,60,125,.08); }
  main.live .steps, main.live .sub { display: none; }
  .line:empty { display: none; }
  .line { margin-top: 4px; min-height: 1.5em; text-align: center; text-wrap: balance;
    font-size: 13.5px; color: var(--mute); font-variant-numeric: tabular-nums; }
  .line b { font-weight: 500; color: var(--brand); margin-right: .8em; }

  .foot { font-size: 11.5px; color: var(--mute); text-align: center; opacity: .8; }
  .foot a { color: inherit; text-underline-offset: 3px; }

  main > * { animation: rise .8s cubic-bezier(.2,.7,.2,1) both; }
  main > :nth-child(n+2) { animation-delay: .12s; }
  @keyframes rise { from { opacity: 0; transform: translateY(10px); } }
  @media (prefers-reduced-motion: reduce) { *, *::before, *::after { transition: none !important; animation: none !important; } }
</style>
</head>
<body>

<header class="top"><a href="/o-projekcie/" aria-label="Benchly"><img src="/benchly-logo.jpg" alt="Benchly" width="404" height="99"></a></header>

<main>
  <div class="portrait" id="portrait">
    <!-- Zdjęcie: avatar.jpg obok index.html, pion 3:4 (np. 1200×1600), twarz w górnej 1/3 -->
    <img src="avatar.jpg" alt="Robert Betlejewski" onerror="this.parentElement.classList.add('noimg')">
    <div class="initials" aria-hidden="true">RB</div>
    <canvas class="wave" id="wave" aria-hidden="true"></canvas>
  </div>

  <button class="call" id="call" type="button" aria-label="Let's talk">
    <svg class="i-mic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0M12 17.5V21"/>
    </svg>
    <svg class="i-stop" viewBox="0 0 24 24" aria-hidden="true"><rect x="7" y="7" width="10" height="10" rx="2" fill="currentColor"/></svg>
  </button>

  <h1 class="name">Robert Betlejewski</h1>
  <p class="sub" id="sub">Tell me what you need. I'll book you a meeting with the real Robert.</p>
  <ol class="steps" id="steps"><li>Describe the job</li><li>See what I can do</li><li>Book a meeting</li></ol>
  <p class="line" id="line" aria-live="polite"></p>
</main>

<footer class="foot">
  <a href="/o-projekcie/">Bench Sp. z o.o.</a> · NIP 9662157768 · KRS 0000945460
</footer>

<script type="module">
  /* ====== KONFIGURACJA ====== */
  const AGENT_ID = "agent_6401k8jvkje2ej789hw4g32wehje";   // Robert Betlejewski AVATAR
  const SDK = "https://cdn.jsdelivr.net/npm/@elevenlabs/client@1.33.0/+esm";
  /* ========================== */

  const $ = (id) => document.getElementById(id);
  const root = document.documentElement, portrait = $("portrait"), btn = $("call"), line = $("line"), cv = $("wave");
  const reduced = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const demo = new URLSearchParams(location.search).has("demo");   // podgląd bez agenta: ?demo
  /* ---------- język: polski system → PL, wszystko inne → EN ---------- */
  const PL = /^pl\b/i.test((navigator.languages && navigator.languages[0]) || navigator.language || "");
  const T = PL ? {
    title: "Robert Betlejewski · porozmawiaj o AI", tagline: "Wdrożenia AI w firmach",
    sub: "Powiedz, czego potrzebujesz. Umówię Cię na spotkanie z prawdziwym Robertem.",
    steps: ["Opowiedz o zleceniu", "Sprawdzę, co mogę zrobić", "Umówię spotkanie"],
    idle: "Zapytaj mnie o&nbsp;AI w&nbsp;Twojej firmie", talk: "Porozmawiaj", end: "Zakończ", connecting: "Łączę…",
    speaking: "Mówię", listening: "Słucham", thanks: "Dzięki za rozmowę!",
    noMic: "Brak dostępu do mikrofonu. Zezwól na niego w przeglądarce i spróbuj ponownie.",
    dropped: "Rozmowa się przerwała. Spróbuj ponownie.", failed: "Nie udało się połączyć. Sprawdź internet i spróbuj ponownie.",
  } : {
    title: "Robert Betlejewski · talk about AI", tagline: "AI implementation for businesses",
    idle: "Ask me about AI in your company", talk: "Let's talk", end: "End call", connecting: "Connecting…",
    speaking: "Speaking", listening: "Listening", thanks: "Thanks for the chat!",
    noMic: "No microphone access. Allow it in your browser and try again.",
    dropped: "The call dropped. Please try again.", failed: "Couldn't connect. Check your internet and try again.",
  };
  if (PL) {
    root.lang = "pl"; document.title = T.title;
    btn.setAttribute("aria-label", T.talk);
    $("sub").textContent = T.sub; $("steps").innerHTML = T.steps.map(t => `<li>${t}</li>`).join("");
  }
  const IDLE = line.innerHTML;

  /* ---------- linia głosu ---------- */
  const N = 26, ctx = cv.getContext("2d"), amp = new Float32Array(N);
  let mode = "idle", convo = null, draw0 = performance.now();

  function resize() {
    const d = devicePixelRatio || 1;
    cv.width = cv.clientWidth * d; cv.height = cv.clientHeight * d; ctx.setTransform(d, 0, 0, d, 0, 0);
  }
  addEventListener("resize", resize); resize();

  function spectrum(src) {                         // środek linii = niskie tony, brzegi = wysokie
    const out = new Float32Array(N);
    if (!src || !src.length) return out;
    const usable = Math.floor(src.length * .3), half = N / 2;
    for (let i = 0; i < N; i++) {
      const k = Math.abs(i - half + .5) / half;
      out[i] = src[Math.floor(k * (usable - 1))] / 255;
    }
    return out;
  }
  function fake(t, scale) {                        // tylko ?demo
    const out = new Float32Array(N), half = N / 2;
    for (let i = 0; i < N; i++) {
      const k = Math.abs(i - half + .5) / half;
      out[i] = scale * (1 - k * .7) * (.55 + .45 * Math.sin(t / 90 + i * 1.7)) * (.7 + .3 * Math.sin(t / 310));
    }
    return out;
  }

  function draw(t) {
    const w = cv.clientWidth, h = cv.clientHeight, mid = h / 2;
    let target = null;
    if (demo && mode !== "idle") target = fake(t, mode === "speaking" ? 1 : .25);
    else if (convo && mode === "speaking") target = spectrum(convo.getOutputByteFrequencyData?.());
    else if (convo && mode === "listening") target = spectrum(convo.getInputByteFrequencyData?.()).map(v => v * .5);
    for (let i = 0; i < N; i++) amp[i] += ((target ? target[i] : 0) - amp[i]) * .22;

    const grow = reduced ? 1 : Math.min(1, (t - draw0) / 900);   // na starcie linia rośnie od środka
    const ease = 1 - Math.pow(1 - grow, 3), x0 = w / 2 * (1 - ease), x1 = w - x0;

    ctx.clearRect(0, 0, w, h);
    ctx.strokeStyle = "#fff"; ctx.lineWidth = 1.75; ctx.lineCap = "round"; ctx.lineJoin = "round";
    ctx.globalAlpha = mode === "idle" ? .45 : 1;

    const pts = [];
    for (let i = 0; i <= N + 1; i++) {
      const u = i / (N + 1), env = Math.sin(Math.PI * u);
      const a = i === 0 || i === N + 1 ? 0 : amp[i - 1];
      pts.push([x0 + (x1 - x0) * u, mid + (i % 2 ? -1 : 1) * Math.pow(a, .7) * env * (h * .48)]);
    }
    ctx.beginPath(); ctx.moveTo(pts[0][0], pts[0][1]);
    for (let i = 1; i < pts.length - 1; i++) {
      const xc = (pts[i][0] + pts[i + 1][0]) / 2, yc = (pts[i][1] + pts[i + 1][1]) / 2;
      ctx.quadraticCurveTo(pts[i][0], pts[i][1], xc, yc);
    }
    ctx.lineTo(pts.at(-1)[0], pts.at(-1)[1]); ctx.stroke();
    ctx.globalAlpha = 1;
    requestAnimationFrame(draw);
  }
  requestAnimationFrame(draw);

  /* ---------- rozmowa ---------- */
  let Conversation = null, clock = 0, t0 = 0;
  const fmt = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
  const tick = () => { line.innerHTML = `<b>${mode === "speaking" ? T.speaking : T.listening}</b>${fmt(Math.floor((Date.now() - t0) / 1000))}`; };

  function goLive() {
    btn.removeAttribute("aria-busy");
    btn.classList.add("live"); portrait.classList.add("live"); btn.parentElement.classList.add("live");
    btn.setAttribute("aria-label", T.end);
    mode = "listening"; t0 = Date.now(); tick(); clock = setInterval(tick, 500);
  }
  function goIdle(msg) {
    clearInterval(clock); convo = null; mode = "idle";
    btn.removeAttribute("aria-busy");
    btn.classList.remove("live"); portrait.classList.remove("live"); btn.parentElement.classList.remove("live");
    btn.setAttribute("aria-label", T.talk);
    line.innerHTML = msg ?? IDLE;
  }

  async function start() {
    if (demo) { goLive(); return; }
    if (AGENT_ID.startsWith("WKLEJ")) { line.textContent = "Brakuje AGENT_ID w pliku index.html."; return; }
    btn.setAttribute("aria-busy", "true"); line.textContent = T.connecting;
    try { await navigator.mediaDevices.getUserMedia({ audio: true }); }
    catch { goIdle(T.noMic); return; }
    try {
      Conversation ??= (await import(SDK)).Conversation;
      const opts = {
        agentId: AGENT_ID,
        ...(PL ? { overrides: { agent: { language: "pl" } } } : {}),
        onConnect: goLive,
        onDisconnect: () => convo && goIdle(T.thanks),
        onError: (e) => { console.error(e); goIdle(T.dropped); },
        onModeChange: ({ mode: m }) => { mode = m === "speaking" ? "speaking" : "listening"; tick(); },
      };
      try { convo = await Conversation.startSession({ ...opts, connectionType: "webrtc" }); }      // szybciej
      catch (e) { console.warn("WebRTC niedostępne, przechodzę na WebSocket", e);
                  convo = await Conversation.startSession({ ...opts, connectionType: "websocket" }); }
    } catch (e) {
      console.error(e); goIdle(T.failed);
    }
  }

  btn.addEventListener("click", async () => {
    if (btn.getAttribute("aria-busy")) return;
    if (mode !== "idle") {
      const c = convo; convo = null;
      try { await c?.endSession(); } catch {}
      goIdle(T.thanks);
    } else start();
  });

  if (demo) setInterval(() => { if (mode !== "idle") mode = (Math.sin(Date.now() / 1100) + 1) / 2 > .4 ? "speaking" : "listening"; }, 200);
</script>
</body>
</html>
